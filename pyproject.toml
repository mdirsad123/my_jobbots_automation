# Ubuntu 22.04 ARM64 / Python 3.12 — JobBots (LinkedIn + n8n API) baseline
# Replaces the heavy Windows-oriented pyproject.toml.
# No torch, transformers, SageMaker, PySpark, Jupyter, or NVIDIA/CUDA packages.

[tool.poetry]
name = "my_jobbots_automation"
version = "0.1.0"
description = "LinkedIn JobBots and n8n FastAPI automation (Ubuntu ARM64 baseline)"
authors = ["Irshad"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# API + Chromium/Selenium automation
fastapi = "^0.125.0"
uvicorn = "^0.38.0"
selenium = "^4.25.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
beautifulsoup4 = "^4.12.2"
fake-useragent = "^1.5.1"
schedule = "^1.2.2"
pytz = "^2024.1"

# Job data, AI requests, and CV/document processing
pandas = ">=2.2.3,<3.0"
openpyxl = "^3.1.5"
openai = "^1.58.1"
cohere = "^4.40"
python-docx = "^1.1.2"
markdownify = "^1.1.0"
pillow = ">=10.4,<12.0"
pymupdf = "^1.26.1"
mss = "^10.1.0"

# Only install if scripts actually need mouse/keyboard GUI automation.
[tool.poetry.group.desktop]
optional = true

[tool.poetry.group.desktop.dependencies]
pyautogui = "^0.9.54"
pynput = "^1.8.0"
pyscreeze = "^1.0.1"
pywhatkit = "^5.4"
opencv-python-headless = "^4.11.0.86"
pytesseract = "^0.3.10"
pypandoc = "^1.15"
nltk = "^3.9.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
